version: 2
updates:
  # Dépendances npm du monorepo (racine)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - "Boh-Diarra"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Dépendances npm de l'application Next.js
  - package-ecosystem: "npm"
    directory: "/apps/portfolio-next"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - "Boh-Diarra"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Actions GitHub
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    assignees:
      - "Boh-Diarra"
    commit-message:
      prefix: "chore"
      include: "scope"
